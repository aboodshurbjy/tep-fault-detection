[project]
name = "tep-fault-detection"
version = "0.1.0"
description = "Early fault detection on the Tennessee Eastman Process benchmark"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyreadr>=0.5",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.39",
    "altair>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
